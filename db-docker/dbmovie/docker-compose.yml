services:
      
  db:
    image: postgres:${DB_VERSION:-18}
    restart: unless-stopped
    ports:
      - ${DB_PORT:-5432}:5432
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      TZ: ${DB_TZ:-Europe/Paris}
      PGTZ: ${DB_TZ:-Europe/Paris}
      POSTGRES_DB: ${DB_NAME:-dbmovie}
      POSTGRES_USER: ${DB_USER:-umovie}
    volumes:
      - ./sql-init:/docker-entrypoint-initdb.d
      - ./scripts:/scripts

  gui:
    image: dpage/pgadmin4:${GUI_TAG:-9.18}
    restart: unless-stopped
    ports:
      - ${GUI_PORT:-8080}:80
    environment:
      PGADMIN_DEFAULT_EMAIL: ${GUI_USER:-admin@example.org}
      PGADMIN_DEFAULT_PASSWORD: ${GUI_PASSWORD:-password}
      PGPASS_FILE: /pgpass
    volumes:
      - ./scripts:/var/lib/pgadmin/storage
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
      - ./pgadmin/pgpass:/pgpass:ro


